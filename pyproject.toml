[project]
name = "adrobot-keitaro-wrapper"
version = "0.1.0"
description = "FastAPI wrapper for Keitaro campaign creation and offer management"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
